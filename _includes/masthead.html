{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main navigation">

        <!-- Site identity / name -->
        <a class="masthead__brand" href="{{ base_path }}/" aria-label="{{ site.title }} — Home">
          <span class="masthead__brand-name">{{ site.title }}</span>
        </a>

        <!-- Desktop links -->
        <ul class="visible-links" role="list">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page" class="active"{% endif %}>{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>

        <!-- Mobile hamburger toggle -->
        <button class="greedy-nav__toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobile-nav">
          <span class="navicon" aria-hidden="true"></span>
        </button>

        <!-- Mobile dropdown -->
        <ul class="hidden-links hidden" id="mobile-nav" role="list"></ul>

      </nav>
    </div>
  </div>
</div>
